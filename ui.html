<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playlist Downloader</title>
<style>
  :root {
    --bg: #f4f4f5;
    --card: #ffffff;
    --ink: #18181b;
    --dim: #71717a;
    --line: #e4e4e7;
    --accent: #c81e1e;
    --accent-ink: #ffffff;
    --ok: #15803d;
    --bad: #b91c1c;
    --field: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #18181b;
      --card: #232327;
      --ink: #f4f4f5;
      --dim: #a1a1aa;
      --line: #35353a;
      --accent: #e23a3a;
      --ok: #4ade80;
      --bad: #f87171;
      --field: #1c1c20;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    justify-content: center;
    padding: 40px 20px 60px;
  }
  main { width: 100%; max-width: 620px; }
  h1 {
    font-size: 20px;
    font-weight: 650;
    margin: 0 0 24px;
    letter-spacing: -0.01em;
  }
  h1 span { color: var(--accent); }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 22px;
    margin-bottom: 16px;
  }
  label { display: block; font-weight: 550; margin-bottom: 7px; }
  .hint { color: var(--dim); font-size: 13px; margin: 7px 0 0; }
  input[type=text] {
    width: 100%;
    padding: 11px 13px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--field);
    color: var(--ink);
    font: inherit;
    font-size: 14px;
  }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button {
    font: inherit;
    font-weight: 550;
    border: 0;
    border-radius: 8px;
    padding: 11px 20px;
    cursor: pointer;
    background: var(--accent);
    color: var(--accent-ink);
  }
  button:hover { filter: brightness(1.08); }
  button:disabled { opacity: .5; cursor: default; filter: none; }
  button.quiet {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--line);
  }
  .row { display: flex; gap: 10px; align-items: center; }
  .row > input { flex: 1; }
  .choices { display: grid; gap: 9px; margin-top: 4px; }
  .choice {
    display: flex;
    gap: 11px;
    align-items: flex-start;
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 12px 14px;
    cursor: pointer;
  }
  .choice:hover { border-color: var(--dim); }
  .choice input { margin: 3px 0 0; accent-color: var(--accent); }
  .choice b { font-weight: 550; display: block; }
  .choice small { color: var(--dim); }
  .found {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 14px;
    padding-bottom: 16px;
    margin-bottom: 18px;
    border-bottom: 1px solid var(--line);
  }
  .found b { font-weight: 600; }
  .found span { color: var(--dim); font-size: 13px; white-space: nowrap; }
  .bar {
    height: 8px;
    background: var(--line);
    border-radius: 99px;
    overflow: hidden;
    margin: 14px 0 10px;
  }
  .bar > i {
    display: block;
    height: 100%;
    width: 0;
    background: var(--accent);
    border-radius: 99px;
    transition: width .3s ease;
  }
  .now { font-weight: 550; }
  .meta { color: var(--dim); font-size: 13px; display: flex; gap: 16px; }
  .log {
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    max-height: 210px;
    overflow-y: auto;
    font-size: 13.5px;
  }
  .log div { padding: 3px 0; color: var(--dim); }
  .log div::before { content: "✓ "; color: var(--ok); }
  .err { color: var(--bad); font-size: 13.5px; margin-top: 12px; }
  .end { display: flex; gap: 10px; margin-top: 18px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Playlist <span>Downloader</span></h1>

  <section class="card" id="s-link">
    <label for="url">YouTube link</label>
    <div class="row">
      <input type="text" id="url" placeholder="https://www.youtube.com/playlist?list=..." spellcheck="false">
      <button id="check">Check</button>
    </div>
    <p class="hint" id="link-hint">Paste a playlist or video link.</p>
    <p class="err" id="link-err" hidden></p>
  </section>

  <section class="card" id="s-options" hidden>
    <div class="found">
      <b id="pl-title"></b>
      <span id="pl-count"></span>
    </div>

    <label for="folder">Save to</label>
    <input type="text" id="folder" spellcheck="false">
    <p class="hint">The folder is created if it doesn't exist.</p>

    <div style="height:18px"></div>

    <label>Format</label>
    <div class="choices">
      <label class="choice">
        <input type="radio" name="fmt" value="best" checked>
        <span><b>Video, best quality</b><small>Highest resolution available. Bigger files.</small></span>
      </label>
      <label class="choice">
        <input type="radio" name="fmt" value="1080">
        <span><b>Video, up to 1080p</b><small>Plenty for most screens, much smaller.</small></span>
      </label>
      <label class="choice">
        <input type="radio" name="fmt" value="mp3">
        <span><b>Music only, MP3</b><small>Audio with cover art and track titles.</small></span>
      </label>
    </div>

    <div class="end">
      <button id="start">Start download</button>
      <button class="quiet" id="back">Back</button>
    </div>
  </section>

  <section class="card" id="s-run" hidden>
    <div class="found">
      <b id="run-title"></b>
      <span id="run-count"></span>
    </div>
    <div class="now" id="now">Starting...</div>
    <div class="bar"><i id="fill"></i></div>
    <div class="meta">
      <span id="pct"></span>
      <span id="speed"></span>
      <span id="eta"></span>
    </div>
    <div class="log" id="log"></div>
    <div class="end">
      <button class="quiet" id="stop">Stop</button>
    </div>
  </section>

  <section class="card" id="s-done" hidden>
    <b id="done-msg"></b>
    <p class="hint" id="done-where"></p>
    <div class="end">
      <button id="open">Open folder</button>
      <button class="quiet" id="again">Download another</button>
    </div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const show = (...on) => ['s-link','s-options','s-run','s-done']
  .forEach(s => $(s).hidden = !on.includes(s));

let info = null, folder = '', timer = null;

async function api(path, body) {
  const opt = body ? {method:'POST', body: JSON.stringify(body)} : {};
  const r = await fetch(path, opt);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

api('/api/defaults').then(d => {
  if (d.clipboard) {
    $('url').value = d.clipboard;
    $('link-hint').textContent = 'Taken from your clipboard. Press Check, or paste a different link.';
  }
}).catch(() => {});

$('check').onclick = async () => {
  const url = $('url').value.trim();
  $('link-err').hidden = true;
  if (!url) return;
  $('check').disabled = true;
  $('check').textContent = 'Checking...';
  try {
    info = await api('/api/info', {url});
    $('pl-title').textContent = info.title;
    $('pl-count').textContent = info.count > 1 ? info.count + ' videos' : 'single video';
    $('folder').value = info.suggested;
    show('s-options');
  } catch (e) {
    $('link-err').textContent = String(e.message || e);
    $('link-err').hidden = false;
  }
  $('check').disabled = false;
  $('check').textContent = 'Check';
};

$('url').onkeydown = e => { if (e.key === 'Enter') $('check').click(); };
$('back').onclick = () => show('s-link');

$('start').onclick = async () => {
  folder = $('folder').value.trim();
  const format = document.querySelector('input[name=fmt]:checked').value;
  $('start').disabled = true;
  try {
    await api('/api/start', {url: info.url, folder, format});
    $('run-title').textContent = info.title;
    $('run-count').textContent = info.count > 1 ? info.count + ' videos' : 'single video';
    $('log').innerHTML = '';
    show('s-run');
    timer = setInterval(poll, 700);
  } catch (e) {
    $('link-err').textContent = String(e.message || e);
    $('link-err').hidden = false;
    show('s-link');
  }
  $('start').disabled = false;
};

function poll() {
  api('/api/progress').then(p => {
    const total = info.count || 1;
    const done = p.done.length;
    $('now').textContent = p.title || 'Working...';
    $('pct').textContent = p.percent || '';
    $('speed').textContent = p.speed || '';
    $('eta').textContent = p.eta && p.eta !== 'NA' ? 'ETA ' + p.eta : '';

    const item = parseFloat(p.percent) || 0;
    $('fill').style.width = Math.min(100, ((done + item/100) / total) * 100) + '%';

    if (done !== $('log').childElementCount) {
      $('log').innerHTML = p.done.map(t =>
        '<div>' + t.replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])) + '</div>'
      ).join('');
      $('log').scrollTop = $('log').scrollHeight;
    }

    if (p.finished) {
      clearInterval(timer);
      const failed = total - done;
      $('done-msg').textContent =
        done === 0 && p.exitCode === 0 ? 'Nothing new. These are already in that folder.'
        : done === 0                   ? 'Nothing downloaded. The videos may be private or region-locked.'
        : failed > 0                   ? done + ' of ' + total + ' downloaded, ' + failed + ' skipped.'
        :                                'All done. ' + done + (done > 1 ? ' files.' : ' file.');
      $('done-where').textContent = folder;
      show('s-done');
    }
  }).catch(() => {});
}

$('stop').onclick = async () => {
  clearInterval(timer);
  await api('/api/stop', {});
  $('done-msg').textContent = 'Stopped. Anything finished is saved.';
  $('done-where').textContent = folder;
  show('s-done');
};

$('open').onclick = () => api('/api/open', {folder});
$('again').onclick = () => { show('s-link'); $('url').select(); };
</script>
</body>
</html>
