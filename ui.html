<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playlist Downloader</title>
<style>
  :root {
    --bg: #f4f4f5;
    --card: #ffffff;
    --ink: #18181b;
    --dim: #71717a;
    --line: #e4e4e7;
    --accent: #c81e1e;
    --accent-ink: #ffffff;
    --ok: #15803d;
    --bad: #b91c1c;
    --field: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #18181b;
      --card: #232327;
      --ink: #f4f4f5;
      --dim: #a1a1aa;
      --line: #35353a;
      --accent: #e23a3a;
      --ok: #4ade80;
      --bad: #f87171;
      --field: #1c1c20;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    justify-content: center;
    padding: 40px 20px 60px;
  }
  main { width: 100%; max-width: 620px; }
  h1 {
    font-size: 20px;
    font-weight: 650;
    margin: 0 0 24px;
    letter-spacing: -0.01em;
  }
  h1 span { color: var(--accent); }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 22px;
    margin-bottom: 16px;
  }
  label { display: block; font-weight: 550; margin-bottom: 7px; }
  .hint { color: var(--dim); font-size: 13px; margin: 7px 0 0; }
  input[type=text] {
    width: 100%;
    padding: 11px 13px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--field);
    color: var(--ink);
    font: inherit;
    font-size: 14px;
  }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button {
    font: inherit;
    font-weight: 550;
    border: 0;
    border-radius: 8px;
    padding: 11px 20px;
    cursor: pointer;
    background: var(--accent);
    color: var(--accent-ink);
  }
  button:hover { filter: brightness(1.08); }
  button:disabled { opacity: .5; cursor: default; filter: none; }
  button.quiet {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--line);
  }
  .row { display: flex; gap: 10px; align-items: center; }
  .row > input { flex: 1; }
  .settings {
    margin-top: 20px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
  }
  .formats { display: flex; gap: 8px; flex-wrap: wrap; }
  .formats label {
    flex: 1 1 auto;
    margin: 0;
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 10px 13px;
    cursor: pointer;
    font-weight: 500;
    font-size: 14px;
    white-space: nowrap;
  }
  .formats label:hover { border-color: var(--dim); }
  .formats input { accent-color: var(--accent); margin-right: 7px; }
  .formats small { display: block; color: var(--dim); font-weight: 400; font-size: 12.5px; padding-left: 21px; }
  .found {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 14px;
    padding-bottom: 16px;
    margin-bottom: 18px;
    border-bottom: 1px solid var(--line);
  }
  .found b { font-weight: 600; }
  .found span { color: var(--dim); font-size: 13px; white-space: nowrap; }
  .bar {
    height: 8px;
    background: var(--line);
    border-radius: 99px;
    overflow: hidden;
    margin: 14px 0 10px;
  }
  .bar > i {
    display: block;
    height: 100%;
    width: 0;
    background: var(--accent);
    border-radius: 99px;
    transition: width .3s ease;
  }
  .now { font-weight: 550; }
  .meta { color: var(--dim); font-size: 13px; display: flex; gap: 16px; }
  .where { color: var(--dim); font-size: 12.5px; margin-top: 14px; word-break: break-all; }
  .log {
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    max-height: 210px;
    overflow-y: auto;
    font-size: 13.5px;
  }
  .log div { padding: 3px 0; color: var(--dim); }
  .log div::before { content: "\2713 "; color: var(--ok); }
  .err { color: var(--bad); font-size: 13.5px; margin-top: 12px; }
  .end { display: flex; gap: 10px; margin-top: 18px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Playlist <span>Downloader</span></h1>

  <section class="card" id="s-link">
    <label for="url">YouTube link</label>
    <div class="row">
      <input type="text" id="url" placeholder="https://www.youtube.com/playlist?list=..." spellcheck="false">
      <button id="go">Download</button>
    </div>
    <p class="hint" id="link-hint">Paste a link anywhere on this page and it starts downloading.</p>
    <p class="err" id="link-err" hidden></p>

    <div class="settings">
      <label>Format</label>
      <div class="formats">
        <label><input type="radio" name="fmt" value="best" checked>Video
          <small>Best quality</small></label>
        <label><input type="radio" name="fmt" value="1080">Video 1080p
          <small>Smaller files</small></label>
        <label><input type="radio" name="fmt" value="mp3">Music
          <small>MP3 with cover art</small></label>
      </div>

      <div style="height:16px"></div>

      <label for="folder">Save to</label>
      <input type="text" id="folder" spellcheck="false" placeholder="Downloads, in a folder named after the playlist">
      <p class="hint">Leave empty for that. Both settings are remembered.</p>
    </div>
  </section>

  <section class="card" id="s-run" hidden>
    <div class="found">
      <b id="run-title">Reading the link...</b>
      <span id="run-count"></span>
    </div>
    <div class="now">Starting...</div>
    <div class="bar"><i id="fill"></i></div>
    <div class="meta">
      <span id="pct"></span>
      <span id="speed"></span>
      <span id="eta"></span>
    </div>
    <div class="where" id="run-where"></div>
    <div class="log" id="log"></div>
    <div class="end">
      <button class="quiet" id="stop">Stop</button>
    </div>
  </section>

  <section class="card" id="s-done" hidden>
    <b id="done-msg"></b>
    <p class="hint" id="done-where"></p>
    <div class="end">
      <button id="open">Open folder</button>
      <button class="quiet" id="again">Download another</button>
    </div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const show = (...on) => ['s-link','s-run','s-done']
  .forEach(s => $(s).hidden = !on.includes(s));

let total = 1, folder = '', timer = null, barMax = 0, busy = false;

async function api(path, body) {
  const opt = body ? {method:'POST', body: JSON.stringify(body)} : {};
  const r = await fetch(path, opt);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

// Remember the format and folder between runs.
const store = {
  get(k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
const savedFmt = store.get('fmt', 'best');
const savedDir = store.get('dir', '');
const fmtInput = document.querySelector('input[name=fmt][value="' + savedFmt + '"]');
if (fmtInput) fmtInput.checked = true;
$('folder').value = savedDir;

api('/api/defaults').then(d => {
  if (d.clipboard) {
    $('url').value = d.clipboard;
    $('link-hint').textContent = 'Link taken from your clipboard. Press Download, or paste another.';
  }
}).catch(() => {});

// Paste anywhere and it goes, no clicking into the box first.
document.addEventListener('paste', e => {
  if ($('s-link').hidden) return;
  const text = ((e.clipboardData || window.clipboardData).getData('text') || '').trim();
  if (!text) return;
  e.preventDefault();
  $('url').value = text;
  start();
});

$('go').onclick = start;
$('url').onkeydown = e => { if (e.key === 'Enter') start(); };

async function start() {
  const url = $('url').value.trim();
  if (!url || busy) return;
  busy = true;
  barMax = 0;
  $('link-err').hidden = true;
  $('go').disabled = true;

  const format = document.querySelector('input[name=fmt]:checked').value;
  const wanted = $('folder').value.trim();
  store.set('fmt', format);
  store.set('dir', wanted);

  $('run-title').textContent = 'Reading the link...';
  $('run-count').textContent = '';
  $('run-where').textContent = '';
  $('log').innerHTML = '';
  $('fill').style.width = '0';
  show('s-run');

  try {
    const info = await api('/api/info', {url});
    total  = info.count || 1;
    folder = wanted || info.suggested;
    $('run-title').textContent = info.title;
    $('run-count').textContent = total > 1 ? total + ' videos' : 'single video';
    $('run-where').textContent = folder;

    await api('/api/start', {url: info.url, folder, format});
    timer = setInterval(poll, 700);
  } catch (e) {
    $('link-err').textContent = String(e.message || e);
    $('link-err').hidden = false;
    show('s-link');
  }
  busy = false;
  $('go').disabled = false;
}

function poll() {
  api('/api/progress').then(p => {
    const done = p.done.length;
    document.querySelector('.now').textContent = p.title || 'Working...';
    $('pct').textContent = p.percent || '';
    $('speed').textContent = p.speed || '';
    $('eta').textContent = p.eta && p.eta !== 'NA' ? 'ETA ' + p.eta : '';

    // An MP4 is video then audio, each counting 0-100, so the raw figure
    // drops back mid-video. Only ever let the bar move forwards.
    const item = parseFloat(p.percent) || 0;
    barMax = Math.max(barMax, Math.min(100, ((done + item/100) / total) * 100));
    $('fill').style.width = barMax + '%';

    if (done !== $('log').childElementCount) {
      $('log').innerHTML = p.done.map(t =>
        '<div>' + t.replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])) + '</div>'
      ).join('');
      $('log').scrollTop = $('log').scrollHeight;
    }

    if (p.finished) {
      clearInterval(timer);
      const failed = total - done;
      $('done-msg').textContent =
        done === 0 && p.exitCode === 0 ? 'Nothing new. These are already in that folder.'
        : done === 0                   ? 'Nothing downloaded. The videos may be private or region-locked.'
        : failed > 0                   ? done + ' of ' + total + ' downloaded, ' + failed + ' skipped.'
        :                                'All done. ' + done + (done > 1 ? ' files.' : ' file.');
      $('done-where').textContent = folder;
      show('s-done');
    }
  }).catch(() => {});
}

$('stop').onclick = async () => {
  clearInterval(timer);
  await api('/api/stop', {});
  $('done-msg').textContent = 'Stopped. Anything finished is saved.';
  $('done-where').textContent = folder;
  show('s-done');
};

$('open').onclick = () => api('/api/open', {folder});
$('again').onclick = () => { show('s-link'); $('url').value = ''; $('url').focus(); };
</script>
</body>
</html>
