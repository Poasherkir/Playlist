<svg xmlns="http://www.w3.org/2000/svg" width="720" height="286" viewBox="0 0 720 286" role="img" aria-label="The downloader page mid-playlist: Lo-fi beats to study to, 34 videos, 62.4 percent done at 4.11 MiB per second.">
  <style>
